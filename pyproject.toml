[project]
name = "data-plum"
version = "0.1.1"
description = "A data plumbing library for research pipelines"
readme = "README.md"
authors = [
    { name = "Krish Matta", email = "self@krishmatta.net" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.4.2",
    "pydantic>=2",
    "typer>=0.19",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17"]
torch = ["torch>=2"]

[project.scripts]
plum = "plum.__main__:app"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "plum"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyarrow>=17",
    "torch>=2",
]
