[project]
name = "plum"
version = "0.1.0"
description = "A reusable research-pipeline library: pipelines, artifacts, catalog, registries."
readme = "README.md"
authors = [
    { name = "Krish Matta", email = "self@krishmatta.net" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "typer>=0.19",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17"]
torch = ["torch>=2"]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
